
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">

    <title>Planit AI</title>

    <script type="module" src="./js/main.js" defer></script>
</head>

<body class="bg-cyan-100">

    <header>
        <nav id="navbar" class="min-h-[17vh] flex flex-col md:flex-row justify-between items-center bg-cyan-300 py-3 px-4">

            <a href="index.html">
                <img src="./img/logo.png" alt="logo de planit ai" class="h-[60px] md:h-[70px] p-[7px]">
            </a>

            <ul id="ul-nav" class="flex flex-col sm:flex-row flex-wrap justify-center items-center text-blue-700 gap-4 md:gap-[30px] p-3 md:p-[20px] font-display font-extrabold text-lg md:text-2xl">

                <li><a href="index.html">Dashboard</a></li>

                <li><a href="new-project.html">+ Nouveau Projet</a></li>

                <li>
                    <button id="openAI" class="text-base md:text-xl bg-blue-700 text-white p-3 md:p-[15px] rounded-[6px]">
                        Paramètres IA
                    </button>
                </li>

            </ul>
        </nav>
    </header>

    <main>

        <div id="introduction" class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-5 p-5 md:p-[30px] mt-5 md:mt-10">

            <div>
                <h1 class="font-display font-extrabold text-2xl md:text-3xl">
                    Mes Projets
                </h1>

                <p class="text-sm md:text-base">
                    Suivez L'avancement de Vos Plans de Developpement
                </p>
            </div>

            <a href="new-project.html">
                <button class="bg-blue-700 shadow-lg shadow-blue-500/50 text-white h-[50px] md:h-[60px] w-[180px] md:w-[200px] rounded-[5px] font-extrabold font-display">
                    + Nouveau Projet
                </button>
            </a>

        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 place-items-center gap-6 md:gap-[30px] px-5 md:px-10 py-5">

            <div class="flex flex-col justify-between p-5 w-full max-w-[400px] min-h-[300px] md:h-[350px] bg-white rounded-[6px] shadow-lg shadow-white-900/30">

                <div>
                    <p id="dachdescription" class="font-display font-extrabold"></p>
                </div>

                <div class="flex flex-wrap justify-between items-end gap-3">

                    <button id="btndelet" class="h-[40px] w-[120px] bg-white rounded-[6px] text-blue-700 font-display font-extrabold shadow-lg shadow-white-500/50 border-[2px] border-blue-700">
                        supprime
                    </button>

                    <a href="./kanban.html">
                        <button id="btnouvrir" class="h-[40px] w-[120px] bg-blue-700 rounded-[6px] text-white font-display font-extrabold shadow-lg shadow-blue-500/50">
                            ouvrir
                        </button>
                    </a>

                </div>

            </div>

        </div>

    </main>

    <dialog id="popup" class="bg-cyan-100 rounded-lg p-6 w-[90%] max-w-[400px]">

        <p class="text-xl md:text-2xl mb-4">
            Votre API Key
        </p>

        <input
            type="password"
            name="AI.url"
            id="inp-api"
            placeholder="API key"
            class="border-blue-700 border-[2px] rounded-[6px] h-[40px] w-full px-2 focus:outline-none"
        >

        <button type="submit" id="closeAI" class="bg-blue-500 h-[45px] w-full mt-4 text-white rounded-[8px]">
            submit
        </button>

    </dialog>

</body>
</html>
