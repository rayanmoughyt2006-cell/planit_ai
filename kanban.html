
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLANIT AI | Project Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen">
    <header>
        <nav id="navbar"
            class="min-h-[17vh] flex flex-wrap justify-between items-center bg-cyan-300 px-6 py-3">

            <a href="index.html">
                <img src="./img/logo.png"
                    alt="Planit AI logo"
                    class="h-[70px] p-[7px]">
            </a>

            <ul id="ul-nav"
                class="flex flex-wrap items-center text-blue-700 gap-5 p-3 font-extrabold text-lg">

                <li><a href="index.html">Dashboard</a></li>
                <li><a href="new-project.html">+ Nouveau Projet</a></li>
                <li>
                    <button id="openAI"
                        class="text-base bg-blue-700 text-white px-4 py-3 rounded-md">
                        Paramètres IA
                    </button>
                </li>
            </ul>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-4 md:px-8 py-10">

        <!-- Project Summary -->
        <section id="project-summary"
            class="bg-white rounded-xl shadow-md p-6 mb-8">

            <div class="flex flex-col md:flex-row justify-between gap-5">

                <div>
                    <p class="text-sm text-cyan-600 font-bold mb-2">
                        MY PROJECT
                    </p>

                    <h1 id="project-name"
                        class="text-3xl font-extrabold text-slate-800">
                        E-Commerce Website
                    </h1>

                    <p class="text-slate-500 mt-2">
                        Project management and development progress.
                    </p>
                </div>

                <div class="flex flex-wrap gap-6">

                    <div>
                        <p class="text-slate-400 text-sm">Duration</p>
                        <p id="project-duration"
                            class="text-lg font-bold text-slate-800">
                            14 Days
                        </p>
                    </div>

                    <div>
                        <p class="text-slate-400 text-sm">Developers</p>
                        <p id="developers-count"
                            class="text-lg font-bold text-slate-800">
                            3 Developers
                        </p>
                    </div>

                    <div>
                        <p class="text-slate-400 text-sm">Total Hours</p>
                        <p id="total-hours"
                            class="text-lg font-bold text-slate-800">
                            45 Hours
                        </p>
                    </div>

                </div>
            </div>

            <!-- Progress Bar -->
            <div class="mt-8">

                <div class="flex justify-between items-center mb-2">
                    <h2 class="font-bold text-slate-700">
                        Project Progress
                    </h2>

                    <span id="progress-percentage"
                        class="font-bold text-cyan-600">
                        0%
                    </span>
                </div>

                <div class="w-full bg-slate-200 rounded-full h-3">
                    <div id="progress-bar"
                        class="bg-cyan-500 h-3 rounded-full w-0">
                    </div>
                </div>

            </div>
        </section>


        <!-- Kanban Board -->
        <section id="kanban-board">

            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">

                <div>
                    <h2 class="text-2xl font-extrabold text-slate-800">
                        Project Tasks
                    </h2>

                    <p class="text-slate-500 mt-1">
                        Organize and track your tasks.
                    </p>
                </div>

                <button id="add-task-btn"
                    class="bg-blue-700 text-white px-5 py-3 rounded-lg font-bold hover:bg-blue-800">
                    + Add Task
                </button>

            </div>


            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                <!-- TO DO -->
                <div id="todo"
                    class="bg-slate-200 rounded-xl p-4 min-h-[350px]">

                    <div class="flex justify-between items-center mb-5">
                        <h3 class="font-extrabold text-slate-700 text-lg">
                            To Do
                        </h3>

                        <span id="todo-count"
                            class="bg-white px-3 py-1 rounded-full text-sm font-bold">
                            0
                        </span>
                    </div>

                    <div id="todo-tasks" class="space-y-4">


                    </div>
                </div>


                <div id="inprogress"
                    class="bg-blue-50 rounded-xl p-4 min-h-[350px]">

                    <div class="flex justify-between items-center mb-5">
                        <h3 class="font-extrabold text-blue-800 text-lg">
                            In Progress
                        </h3>

                        <span id="inprogress-count"
                            class="bg-white px-3 py-1 rounded-full text-sm font-bold">
                            0
                        </span>
                    </div>

                    <div id="inprogress-tasks" class="space-y-4">

                    </div>
                </div>

                <div id="done"
                    class="bg-green-50 rounded-xl p-4 min-h-[350px]">

                    <div class="flex justify-between items-center mb-5">
                        <h3 class="font-extrabold text-green-800 text-lg">
                            Done
                        </h3>

                        <span id="done-count"
                            class="bg-white px-3 py-1 rounded-full text-sm font-bold">
                            0
                        </span>
                    </div>

                    <div id="done-tasks" class="space-y-4">

                    </div>
                </div>

            </div>
        </section>


        <!-- Task Details Modal -->
        <div id="task-modal"
            class="hidden fixed inset-0 bg-black/50 z-50 flex justify-center items-center p-4">

            <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6">

                <div class="flex justify-between items-center mb-6">

                    <h2 class="text-2xl font-extrabold text-slate-800">
                        Task Details
                    </h2>

                    <button id="close-modal"
                        class="text-2xl text-slate-500 hover:text-red-500"
                        aria-label="Close modal">
                        &times;
                    </button>

                </div>

                <form id="task-form">

                    <div class="mb-4">
                        <label for="task-title"
                            class="block font-bold text-slate-700 mb-2">
                            Task Title
                        </label>

                        <input type="text" id="task-title"
                            class="w-full border border-slate-300 rounded-lg p-3"
                            placeholder="Enter task title">
                    </div>

                    <div class="mb-4">
                        <label for="task-description"
                            class="block font-bold text-slate-700 mb-2">
                            Description
                        </label>

                        <textarea id="task-description"
                            rows="4"
                            class="w-full border border-slate-300 rounded-lg p-3"
                            placeholder="Task description"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                        <div>
                            <label for="task-priority"
                                class="block font-bold text-slate-700 mb-2">
                                Priority
                            </label>

                            <select id="task-priority"
                                class="w-full border border-slate-300 rounded-lg p-3">

                                <option value="Low">Low</option>
                                <option value="Medium">Medium</option>
                                <option value="High">High</option>

                            </select>
                        </div>

                        <div>
                            <label for="task-status"
                                class="block font-bold text-slate-700 mb-2">
                                Status
                            </label>

                            <select id="task-status"
                                class="w-full border border-slate-300 rounded-lg p-3">

                                <option value="To Do">To Do</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Done">Done</option>

                            </select>
                        </div>

                        <div>
                            <label for="task-hours"
                                class="block font-bold text-slate-700 mb-2">
                                Estimated Hours
                            </label>

                            <input type="number" id="task-hours"
                                min="1"
                                class="w-full border border-slate-300 rounded-lg p-3">
                        </div>

                        <div>
                            <label for="task-deadline"
                                class="block font-bold text-slate-700 mb-2">
                                Deadline
                            </label>

                            <input type="date" id="task-deadline"
                                class="w-full border border-slate-300 rounded-lg p-3">
                        </div>

                    </div>

                    <div class="flex flex-wrap justify-end gap-3 mt-8">

                        <button type="button" id="delete-task"
                            class="bg-red-100 text-red-700 px-5 py-3 rounded-lg font-bold">
                            Delete
                        </button>

                        <button type="button" id="cancel-task"
                            class="bg-slate-200 text-slate-700 px-5 py-3 rounded-lg font-bold">
                            Cancel
                        </button>

                        <button type="submit"
                            class="bg-blue-700 text-white px-5 py-3 rounded-lg font-bold">
                            Save Changes
                        </button>

                    </div>

                </form>

            </div>
        </div>

    </main>

</body>
</html>
