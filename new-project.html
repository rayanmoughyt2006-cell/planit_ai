
<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<script src="https://cdn.tailwindcss.com"></script>
		<link rel="stylesheet" href="style.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/parsleyjs@2.9.2/dist/parsley.min.js"></script>
		<title> Planit AI </title>
		<script type="module"  src="./js/main.js" defer></script>	
	</head>
<body class="p-0 m-0">
    <header>
			<nav id="navbar" class="min-h-[17vh] w-full flex flex-col md:flex-row justify-between items-center bg-cyan-400 px-4 py-3">
				<a href="index.html"><img src="./img/logo.png" alt="logo de palnit ai" class="h-[70px] p-[7px]"></a>
				<ul id="ul-nav" class="flex flex-col sm:flex-row flex-wrap justify-center items-center text-blue-700 gap-4 md:gap-[30px] p-[20px] font-display font-extrabold text-lg md:text-2xl">
					<li><a href="index.html"> Dashboard     </a></li>
					<li><a href="new-project.html">  + Nouveau Projet </a></li>
					<li><button id="openAI" class="text-lg md:text-xl bg-blue-700 text-white p-[15px] rounded-[6px]"> Paramètres IA </button></li>
				</ul>
			</nav>
	</header>
    <main class="bg-cyan-100">
        <section class="px-4 py-8 sm:px-8 md:p-[60px] lg:p-[100px] flex flex-col justify-center min-h-[85vh]" >
            <div class="bg-white shadow-lg shadow-white-900/50 rounded-[12px] w-full">
                <div class="w-full p-5 md:p-[30px]">
                    <div class="flex flex-col justify-center gap-[5px]">
                        <h1 class="font-display font-extrabold text-3xl md:text-5xl "> Creer un nouveau Projet </h1>
                        <p class="text-base md:text-xl"> Decrivez Votre projet pour generet un plan de Developpementrealiste .</p>
                    </div>
                </div>
                    <form id="formel" action="" class="flex flex-col gap-[25px] p-5 md:p-[50px] rounded-[4px]" data-parsley-validate>

                        <div class="flex flex-col md:flex-row justify-between gap-5">
                            <div class="flex flex-col gap-[10px] w-full">
                                <label for="nomprojet" class="font-extrabold font-display" > Nom du projet </label>
                                <input type="text" name="nom de projet" id="nomprojet" placeholder="Ex.Application de reservation" class="border-[2px] border-blue-700 h-[40px] w-full md:w-[250px] rounded-[4px] px-2" required >
                            </div>
                            <div class="flex flex-col gap-[10px] w-full">
                                <label for="duree" class="font-extrabold font-display"> Duree </label>
                                <input type="number" id="duree" placeholder="001" class="border-[2px] border-blue-700 h-[40px] w-full md:w-[250px] rounded-[4px] px-2" data-parsley-type="number">
                            </div>
                        </div>
                        
                        <div class="flex flex-col gap-[10px]">
                            <label for="descrip" class="font-extrabold font-display">Description</label>
                            <input type="text" name="Description" id="descrip" placeholder="Decrivez votre Description" class="w-full h-[50px] border-[2px] border-blue-700 rounded-[4px] px-2" required data-parsley-maxlength="500">
                        </div> 
                        <div class="flex flex-col gap-[10px]">
                            <label for="textbreif" class="font-extrabold font-display">Breif complet</label>
                            <textarea name="breif" id="textbreif" class="w-full h-[140px] rounded-[4px] border-[2px] border-blue-700 p-2" required data-parsley-required-message="champ is required."></textarea>
                        </div>

                        <div class="flex flex-col md:flex-row justify-between gap-5">
                            <div class="flex flex-row w-full">
                                <select name="select" id="niveauselect" class="h-[60px] w-full md:w-[350px] rounded-[6px] bg-white border-[2px] border-blue-700 shadow-lg shadow-blue-700/50 font-extrabold font-display px-2">
                                <option value="" disabled selected> Niveau de difficulté  </option>
                                <option value="Beginner"> Beginner </option>
                                <option value="Intermediate"> Intermediate </option>
                                <option value="Advanced"> Advanced </option>
                            </select>
                            </div>
                            <div class="flex flex-col gap-[10px] w-full">
                                <label for="inpttechno" class="font-extrabold font-display">Technologies</label>
                                <input type="text" id="inpttechno" class="w-full h-[50px] border-[2px] border-blue-700 rounded-[4px] px-2">
                            </div>
                        </div>

                        <div class="flex flex-col sm:flex-row justify-between gap-5">
                            <select name="select" id="selectnumber" class="h-[60px] w-full sm:w-[350px] rounded-[6px] bg-white border-[2px] border-blue-700 shadow-lg shadow-blue-700/50 font-extrabold font-display px-2">
                                <option value="" disabled selected> Nomber de développeur </option>
                                <option value="1"> 1 développeur</option>
                                <option value="2"> 2 développeur</option>
                                <option value="3"> 3 développeur</option>
                                <option value="+3"> Plusieurs développeurs </option>
                            </select>
                            <button type="submit" id="devet" class="bg-blue-700 shadow-lg shadow-blue-700/50 h-[60px] w-full sm:w-[140px] text-white rounded-[6px] font-extrabold font-display"> Devet projet</button>
                        </div>
                    </form>
                <dialog id="popup" class="bg-cyan-100 rounded-[8px] p-5 w-[90%] max-w-[400px]">
				<p class="text-2xl mb-4"> Votre API Key </p>
				<input type="password" name="AI.url" id="inp-api" placeholder="  API key" class="border-blue-700 border-[2px] rounded-[6px] h-[40px] w-full px-2 focus:outline-none">
				<button type="submit" id="closeAI" class="bg-blue-500 h-[50px] w-full mt-4 text-white rounded-[8px]">submit</button>
			</dialog>
            </div>
        </section>
    </main>
</body>
</html>
